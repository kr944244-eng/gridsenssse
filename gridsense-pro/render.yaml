# Render.com blueprint: New + > Blueprint > pick this repo (or create a Web Service with the same commands)
services:
  - type: web
    name: gridsense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /tmp/gridsense
